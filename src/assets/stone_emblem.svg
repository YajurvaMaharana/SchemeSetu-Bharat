<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Stone Texture Filter & Lighting -->
    <filter id="stoneRelief" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#FAF7F2" surfaceScale="2" result="light">
        <feDistantLight azimuth="55" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <radialGradient id="stoneTileGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="60%" stop-color="#F3ECE0" />
      <stop offset="100%" stop-color="#E5DBCC" />
    </radialGradient>

    <linearGradient id="engraveShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#735E47" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4A3B2C" stop-opacity="0.95" />
    </linearGradient>

    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur" />
      <feOffset dx="1" dy="2" result="offset" />
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Square Light-Beige Stone Tile Base -->
  <rect x="10" y="10" width="380" height="380" rx="16" fill="url(#stoneTileGrad)" stroke="#D6C7B2" stroke-width="3" filter="url(#stoneRelief)" />

  <!-- Inner Bevel Border -->
  <rect x="22" y="22" width="356" height="356" rx="12" fill="none" stroke="#C4B39B" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Outer Circular Engraved Ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#8C7355" stroke-width="3.5" filter="url(#carve)" opacity="0.8" />
  <circle cx="200" cy="200" r="142" fill="none" stroke="#B8A284" stroke-width="1.2" opacity="0.9" />

  <!-- Ashoka Chakra (Top Center) -->
  <g transform="translate(200, 112)" filter="url(#carve)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#5C4730" stroke-width="2.5" />
    <circle cx="0" cy="0" r="4.5" fill="#5C4730" />
    <!-- 24 Spokes -->
    <!-- Radial spokes -->
    <path d="
      M 0 0 L 0 -24 M 0 0 L 0 24 M 0 0 L -24 0 M 0 0 L 24 0
      M 0 0 L 16.97 -16.97 M 0 0 L -16.97 16.97 M 0 0 L -16.97 -16.97 M 0 0 L 16.97 16.97
      M 0 0 L 8.9 -22.3 M 0 0 L -8.9 22.3 M 0 0 L -8.9 -22.3 M 0 0 L 8.9 22.3
      M 0 0 L 22.3 -8.9 M 0 0 L -22.3 8.9 M 0 0 L -22.3 -8.9 M 0 0 L 22.3 8.9
      M 0 0 L 13.5 -19.8 M 0 0 L -13.5 19.8 M 0 0 L -13.5 -19.8 M 0 0 L 13.5 19.8
      M 0 0 L 19.8 -13.5 M 0 0 L -19.8 13.5 M 0 0 L -19.8 -13.5 M 0 0 L 19.8 13.5
    " stroke="#5C4730" stroke-width="1.2" />
  </g>

  <!-- Left Wheat Stalk (Curving downwards along border) -->
  <g transform="translate(80, 200)" filter="url(#carve)">
    <path d="M 30 -60 Q -10 0 25 80" fill="none" stroke="#665038" stroke-width="2.5" />
    <!-- Grains Left -->
    <ellipse cx="28" cy="-52" rx="4" ry="7" transform="rotate(-30 28 -52)" fill="#5C4730" />
    <ellipse cx="18" cy="-35" rx="4.5" ry="8" transform="rotate(-40 18 -35)" fill="#5C4730" />
    <ellipse cx="10" cy="-15" rx="5" ry="8.5" transform="rotate(-50 10 -15)" fill="#5C4730" />
    <ellipse cx="6" cy="10" rx="5" ry="9" transform="rotate(-65 6 10)" fill="#5C4730" />
    <ellipse cx="10" cy="35" rx="5" ry="8.5" transform="rotate(-80 10 35)" fill="#5C4730" />
    <ellipse cx="20" cy="60" rx="4.5" ry="7.5" transform="rotate(-100 20 60)" fill="#5C4730" />
  </g>

  <!-- Right Wheat Stalk (Curving downwards along border) -->
  <g transform="translate(320, 200) scale(-1, 1)" filter="url(#carve)">
    <path d="M 30 -60 Q -10 0 25 80" fill="none" stroke="#665038" stroke-width="2.5" />
    <!-- Grains Right -->
    <ellipse cx="28" cy="-52" rx="4" ry="7" transform="rotate(-30 28 -52)" fill="#5C4730" />
    <ellipse cx="18" cy="-35" rx="4.5" ry="8" transform="rotate(-40 18 -35)" fill="#5C4730" />
    <ellipse cx="10" cy="-15" rx="5" ry="8.5" transform="rotate(-50 10 -15)" fill="#5C4730" />
    <ellipse cx="6" cy="10" rx="5" ry="9" transform="rotate(-65 6 10)" fill="#5C4730" />
    <ellipse cx="10" cy="35" rx="5" ry="8.5" transform="rotate(-80 10 35)" fill="#5C4730" />
    <ellipse cx="20" cy="60" rx="4.5" ry="7.5" transform="rotate(-100 20 60)" fill="#5C4730" />
  </g>

  <!-- Central Engraved Serif Typography: "YojanaSathi" -->
  <g filter="url(#carve)">
    <text x="200" y="215" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="30" font-weight="700" letter-spacing="2.5" fill="#423321" text-anchor="middle">
      YojanaSathi
    </text>

    <!-- Subtitle Engraved Typography: "ApnaAdhikar" -->
    <text x="200" y="250" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="16" font-weight="600" letter-spacing="4" fill="#6B543B" text-anchor="middle">
      APNA ADHIKAR
    </text>

    <!-- Sanskrit Civic Tagline underneath -->
    <text x="200" y="275" font-family="'Noto Serif Devanagari', 'Georgia', serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#7D654C" text-anchor="middle">
      सर्वजन हिताय • सर्वजन सुखाय
    </text>
  </g>

  <!-- Bottom Decorative Engraved Flourish -->
  <path d="M 160 295 Q 200 305 240 295" fill="none" stroke="#8C7355" stroke-width="1.8" filter="url(#carve)" />
  <circle cx="200" cy="301" r="2.5" fill="#5C4730" />
</svg>
